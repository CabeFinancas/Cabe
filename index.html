

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="Imagem%20do%20Codex%2015%20de%20set.%20de%202026%2C%2017_05_32.png">
<link rel="apple-touch-icon" href="Imagem%20do%20Codex%2015%20de%20set.%20de%202026%2C%2017_05_32.png">
<title>CABE — Antes de gastar, saiba se cabe</title>
<link rel="icon" type="image/png" href="Logo.png">
<link rel="apple-touch-icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#38BDF8;
    --blue-deep:#0EA5E9;
    --ink:#0F172A;
    --ink-soft:#5B6472;
    --ink-faint:#94A3B0;
    --paper:#FFFFFF;
    --paper-tint:#F2FAFE;
    --line:#E5EEF3;
    --negative:#D6524A;
    --radius-l:22px;
    --radius-m:16px;
    --radius-s:11px;
    /* Cores exatas do manual de marca do CABE — usadas só na logo e no
       wordmark, para a marca sair fiel ao arquivo enviado. O resto do app
       continua com a paleta --blue já em uso, sem mudanças. */
    --cabe-blue:#00B4FF;
    --cabe-navy:#0B1F3B;
    --cabe-tint:#E6F6FF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- LANDING ---------- */
  .landing{max-width:1100px; margin:0 auto; padding:0 24px;}
  .landing-nav{display:flex; align-items:center; justify-content:space-between; padding:22px 0;}
  .landing-nav .brand{font-family:'Space Grotesk'; font-weight:700; font-size:22px; letter-spacing:-0.02em; display:flex; align-items:center; gap:9px; color:var(--cabe-navy);}
  .landing-nav .brand span{color:var(--cabe-blue);}
  .btn-primary{
    background:var(--blue); color:#fff; border:none; border-radius:100px;
    padding:14px 26px; font-weight:600; font-size:15px; transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary.small{padding:10px 20px; font-size:14px;}
  .btn-ghost{
    background:transparent; border:1.5px solid var(--line); color:var(--ink);
    border-radius:100px; padding:13px 24px; font-weight:600; font-size:15px;
  }
  .hero{display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px; align-items:center; padding:56px 0 70px;}
  .hero h1{font-size:44px; line-height:1.08; letter-spacing:-0.02em; font-weight:700; margin:0 0 20px;}
  .hero p.sub{font-size:17px; line-height:1.6; color:var(--ink-soft); max-width:460px; margin:0 0 30px;}
  .eyebrow{color:var(--blue-deep); font-weight:600; font-size:14px; margin-bottom:14px; display:block;}
  .benefits{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; padding:10px 0 64px; border-top:1px solid var(--line); margin-top:8px;}
  .benefit{padding-top:30px;}
  .benefit .n{font-family:'Space Grotesk'; font-weight:600; color:var(--blue-deep); font-size:15px;}
  .benefit p{font-size:16px; font-weight:600; margin:10px 0 6px; letter-spacing:-0.01em;}
  .benefit span{color:var(--ink-soft); font-size:14px;}
  .final-cta{
    background:var(--ink); color:#fff; border-radius:28px; padding:56px 40px; text-align:center; margin-bottom:80px;
  }
  .final-cta h2{font-size:30px; margin:0 0 22px; letter-spacing:-0.02em; font-weight:700;}

  .phone-mock{
    background:var(--paper-tint); border:1px solid var(--line); border-radius:34px; padding:22px; position:relative;
  }
  .phone-card{background:#fff; border-radius:20px; border:1px solid var(--line); padding:22px;}
  .phone-card .lbl{color:var(--ink-soft); font-size:13px;}
  .phone-card .big{font-size:38px; font-weight:700; margin:6px 0 2px;}
  .phone-card .foot{color:var(--ink-faint); font-size:13px;}
  .mini-cabe{
    margin-top:16px; background:var(--paper-tint); border-radius:16px; padding:16px; border:1px solid var(--line);
  }
  .mini-cabe .q{font-size:14px; color:var(--ink-soft); margin-bottom:8px;}
  .mini-cabe .ans{display:flex; align-items:center; gap:8px; color:var(--blue-deep); font-weight:700; font-size:15px;}
  .mini-cabe .dot{width:22px;height:22px;border-radius:50%;background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .mini-cabe .d{color:var(--ink-soft); font-weight:400; font-size:13px; margin-top:4px;}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr; padding:32px 0 44px;}
    .hero h1{font-size:32px;}
    .benefits{grid-template-columns:1fr; gap:26px;}
    .final-cta{padding:40px 24px;}
  }

  /* ---------- ONBOARDING ---------- */
  .onboarding-wrap{max-width:460px; margin:0 auto; width:100%; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px;}
  .onboarding-logo{display:flex; align-items:center; gap:9px; font-family:'Space Grotesk'; font-weight:700; font-size:20px; letter-spacing:-0.02em; margin-bottom:36px; color:var(--cabe-navy);}
  .onboarding-logo span{color:var(--cabe-blue);}
  .onboarding-wrap h1{font-size:26px; line-height:1.25; letter-spacing:-0.02em; font-weight:700; margin:0 0 8px;}
  .onboarding-wrap p.sub{font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 28px;}
  .onboarding-wrap .form-group{margin-bottom:22px;}
  .onboarding-wrap .form-group input{width:100%;}

  /* ---------- APP SHELL ---------- */
  .shell{max-width:460px; margin:0 auto; width:100%; min-height:100vh; display:flex; flex-direction:column; position:relative; background:#fff;}
  .topbar{padding:20px 20px 4px; display:flex; align-items:center; justify-content:space-between;}
  .topbar .back{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .topbar .title{font-weight:700; font-size:17px; letter-spacing:-0.01em;}
  .topbar-logo{width:44px; height:44px; display:flex; align-items:center; flex-shrink:0;}
  .topbar-brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk'; font-weight:700; font-size:19px; letter-spacing:-0.02em; color:var(--cabe-navy);}
  .topbar-brand span{color:var(--cabe-blue);}
  .home-topbar{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;gap:8px 12px;align-items:center}.home-topbar .home-brand{position:static;transform:none;grid-column:2;grid-row:1}.home-topbar .month-switch{grid-column:1 / -1;grid-row:2;justify-self:center}
  .home-brand{display:flex;flex-direction:column;align-items:center;font-family:'Space Grotesk';font-weight:700;font-size:13px;line-height:1;color:var(--cabe-navy)}
  .home-brand span{color:var(--cabe-blue)} .top-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--paper-tint);border:0;font-weight:700;color:var(--blue-deep)}
  .month-switch{display:flex; align-items:center; gap:10px; background:var(--paper-tint); border-radius:100px; padding:6px 8px;}
  .month-switch button{background:none; border:none; color:var(--blue-deep); font-size:15px; font-weight:700; width:26px; height:26px; border-radius:50%;}
  .month-switch span{font-size:14px; font-weight:600; min-width:86px; text-align:center;}

  .content{flex:1; overflow-y:auto; padding:12px 20px 110px;}

  .hello{font-size:22px; font-weight:700; letter-spacing:-0.01em; margin:14px 0 2px;}
  .hello-sub{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}

  .hero-card{
    background:var(--ink); color:#fff; border-radius:var(--radius-l); padding:26px 24px; margin-bottom:14px;
  }
  .hero-card .lbl{color:#B9D9E8; font-size:14px; font-weight:500;}
  .hero-card .amount{font-size:42px; font-weight:700; margin:8px 0 2px; letter-spacing:-0.02em;}
  .hero-card .amount.neg{color:#FFD3CC;}
  .hero-card .foot{color:#9FC3D6; font-size:13px;}
  .breakdown{margin-top:18px; border-top:1px solid rgba(255,255,255,0.14); padding-top:16px; display:flex; flex-direction:column; gap:10px;}
  .breakdown .row{display:flex; justify-content:space-between; font-size:14px;}
  .breakdown .row.total{border-top:1px solid rgba(255,255,255,0.14); padding-top:10px; font-weight:700; font-size:15px;}
  .breakdown .row span:first-child{color:#C7E1EE;}
  .breakdown .row.total span:first-child{color:#fff;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:14px;
  }
  .card.tint{background:var(--paper-tint); border-color:var(--paper-tint);}
  .card-title{font-weight:700; font-size:15px; margin:0 0 4px; letter-spacing:-0.01em;}
  .card-sub{color:var(--ink-soft); font-size:13px; margin:0 0 14px;}

  .cabe-entry{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .cabe-entry .txt p{margin:0;}
  .cabe-entry .go{
    width:44px; height:44px; border-radius:50%; background:var(--blue); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .stat{background:var(--paper-tint); border-radius:var(--radius-m); padding:16px;}
  .stat .lbl{color:var(--ink-soft); font-size:12.5px; font-weight:600;}
  .stat .val{font-size:21px; font-weight:700; margin-top:4px; letter-spacing:-0.01em;}
  .stat .val.blue{color:var(--blue-deep);}

  .bars{display:flex; align-items:stretch; gap:8px; height:158px; margin-top:8px; overflow-x:auto; overscroll-behavior-x:contain; padding:0 2px 4px;}
  .bars .bar-col{flex:0 0 40px; display:grid; grid-template-rows:16px 1fr 15px; align-items:end; gap:4px; height:100%; text-align:center;}
  .bars .bar-track{display:flex; align-items:flex-end; width:100%; height:100%; border-bottom:1px solid var(--line); background:linear-gradient(to top, var(--paper-tint), transparent);}
  .bars .bar{width:100%; border-radius:7px 7px 0 0; background:var(--blue); min-height:3px;}
  .bars .bar.out{background:var(--paper-tint); border:1px solid var(--line);}
  .bars .bar-lbl{font-size:10px; line-height:1; color:var(--ink-soft); white-space:nowrap;}
  .bars .bar-value{font-size:10px; line-height:1; color:var(--blue-deep); font-weight:700; white-space:nowrap;}

  .daily-num{font-size:30px; font-weight:700; color:var(--blue-deep); margin:2px 0;}
  .daily-num.neg-num{color:var(--negative);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
  .section-head h3{font-size:16px; margin:0; letter-spacing:-0.01em;}
  .link-btn{background:none; border:none; color:var(--blue-deep); font-weight:600; font-size:13.5px;}

  .day-group{margin-bottom:16px;}
  .day-group .day-lbl{font-size:12.5px; font-weight:700; color:var(--ink-faint); margin-bottom:8px; letter-spacing:0.02em;}
  .txn{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .txn:last-child{border-bottom:none;}
  .txn .icon{
    width:40px; height:40px; border-radius:12px; background:var(--paper-tint); display:flex;
    align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .txn .mid{flex:1; min-width:0;}
  .txn .mid .d{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn .mid .c{font-size:12.5px; color:var(--ink-soft);}
  .txn .val{font-weight:700; font-size:14.5px; white-space:nowrap;}
  .txn .val.pos{color:var(--blue-deep);}
  .txn .val.neg{color:var(--ink);}

  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty .e{font-size:32px; margin-bottom:10px;}

  .goal-card{margin-bottom:14px;}
  .goal-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .goal-top .ic{width:42px; height:42px; border-radius:12px; background:var(--paper-tint); display:flex; align-items:center; justify-content:center; font-size:19px;}
  .goal-top .nm{font-weight:700; font-size:15px;}
  .goal-top .sub{font-size:12.5px; color:var(--ink-soft);}
  .progress-track{height:9px; border-radius:100px; background:var(--paper-tint); overflow:hidden; margin-bottom:10px;}
  .progress-fill{height:100%; background:var(--blue); border-radius:100px;}
  .goal-meta{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
  .goal-meta b{color:var(--ink); font-weight:700; font-size:13.5px;}

  .proj-input{display:flex; align-items:center; gap:10px; background:var(--paper-tint); border-radius:100px; padding:6px 6px 6px 16px; margin-bottom:16px;}
  .proj-input span{font-size:13.5px; color:var(--ink-soft); flex-shrink:0;}
  .proj-input input{border:none; background:transparent; font-weight:700; font-size:15px; width:100%; outline:none; color:var(--ink);}
  .proj-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px dashed var(--line);}
  .proj-row:last-child{border-bottom:none;}
  .proj-row .p-lbl{font-size:13.5px; color:var(--ink-soft);}
  .proj-row .p-val{font-weight:700; font-size:15.5px;}

  /* Meu patrimônio */
  .pat-total-lbl{color:var(--ink-soft); font-size:13px; font-weight:600;}
  .pat-total-val{font-size:30px; font-weight:700; letter-spacing:-0.01em; margin:2px 0 16px;}
  .donut-row{display:flex; align-items:center; gap:18px;}
  .donut-chart{flex-shrink:0;}
  .donut-legend{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:13px;}
  .legend-row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .legend-row .lg-nome{flex:1; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .legend-row .lg-pct{color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .legend-row .lg-val{font-weight:700; font-size:12.5px; color:var(--ink); min-width:76px; text-align:right;}
  .pat-group-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .pat-group-head .lg-nome, .pat-group-head .pat-group-nome{font-weight:700; font-size:14px; flex:1;}
  .pat-group-head .pat-group-sub{font-weight:700; font-size:14px; color:var(--ink-soft);}

  /* Despesas recorrentes / cartões */
  .rec-card, .cartao-card{cursor:pointer;}
  .venc-row{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .venc-row:last-child{border-bottom:none;}
  .venc-row .icon{width:40px; height:40px; border-radius:12px; background:var(--paper-tint); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .venc-row .mid{flex:1; min-width:0;}
  .venc-row .mid .d{font-weight:600; font-size:14px;}
  .venc-row .mid .c{font-size:12.5px; color:var(--ink-soft);}
  .venc-right{text-align:right; flex-shrink:0;}
  .venc-right .val{margin-bottom:6px;}
  .pay-btn{
    background:var(--paper-tint); border:1px solid var(--line); color:var(--blue-deep); font-weight:700;
    font-size:11.5px; padding:7px 10px; border-radius:100px; white-space:nowrap;
  }
  .badge-pago{
    display:inline-block; background:#EAF8FF; color:var(--blue-deep); font-weight:700; font-size:12.5px;
    padding:6px 14px; border-radius:100px;
  }

  /* Cabe screen */
  .cabe-hero{text-align:center; padding:20px 6px 8px;}
  .cabe-hero .icon-big{
    width:68px; height:68px; border-radius:50%; background:var(--paper-tint); margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; font-size:30px;
  }
  .cabe-hero h2{font-size:20px; margin:0 0 6px;}
  .cabe-hero p{color:var(--ink-soft); font-size:14px; margin:0;}
  .amount-input-wrap{display:flex; align-items:center; justify-content:center; gap:6px; margin:26px 0 22px;}
  .amount-input-wrap .cifrao{font-size:26px; font-weight:700; color:var(--ink-faint);}
  .amount-input-wrap input{
    border:none; outline:none; font-family:'Space Grotesk'; font-size:44px; font-weight:700; width:220px; text-align:left; color:var(--ink);
  }
  .result-card{
    border-radius:var(--radius-l); padding:26px 22px; text-align:center; margin-top:8px;
  }
  .result-card.ok{background:#EAF8FF; border:1px solid #CDECFB;}
  .result-card.no{background:#FDEEEC; border:1px solid #F6D3CE;}
  .result-card .badge{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:24px; margin:0 auto 12px; color:#fff;
  }
  .result-card.ok .badge{background:var(--blue);}
  .result-card.no .badge{background:var(--negative);}
  .result-card h3{margin:0 0 8px; font-size:19px;}
  .result-card.ok h3{color:var(--blue-deep);}
  .result-card.no h3{color:var(--negative);}
  .result-card p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.5;}

  /* Perfil */
  .profile-head{display:flex; align-items:center; gap:14px; padding:10px 0 22px;}
  .avatar{width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; font-family:'Space Grotesk';}
  .profile-head .nm{font-weight:700; font-size:17px;}
  .profile-head .em{color:var(--ink-soft); font-size:13px;}
  .field-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);}
  .field-row:last-child{border-bottom:none;}
  .field-row .l{font-size:14.5px; font-weight:600;}
  .field-row .s{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .field-row input{
    border:none; background:var(--paper-tint); border-radius:10px; padding:9px 12px; font-weight:700;
    font-size:14.5px; width:120px; text-align:right; outline:none;
  }
  .danger-btn{width:100%; padding:14px; border-radius:var(--radius-m); border:1px solid #F6D3CE; background:#FDF4F2; color:var(--negative); font-weight:700; font-size:14.5px; margin-top:8px;}

  /* Bottom nav */
  .bottom-nav{
    position:sticky; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-faint); font-size:11px; font-weight:600; padding:4px 10px; position:relative;
  }
  .nav-btn.active{color:var(--blue-deep);}
  .nav-btn .ic{font-size:20px;}
  .fab{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 8px 20px rgba(56,189,248,0.4);
  }
  .fab-spacer{width:56px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(15,23,42,0.42); display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:#fff; width:100%; max-width:460px; border-radius:26px 26px 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; animation:sheetup .22s ease;
  }
  @keyframes sheetup{from{transform:translateY(30px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .sheet-head h3{margin:0; font-size:17px;}
  .sheet-head .x{width:32px; height:32px; border-radius:50%; background:var(--paper-tint); border:none; color:var(--ink-soft); font-size:16px;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:7px;}
  .form-group input, .form-group select{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; outline:none; background:#fff; color:var(--ink);
  }
  .form-group input:focus, .form-group select:focus{border-color:var(--blue);}

    background-repeat:no-repeat;background-position:right 14px center;

  .catmgr-row input{flex:1; min-width:0; border:none; background:transparent; font-size:14.5px; font-weight:600; color:var(--ink); padding:6px 0; outline:none;}

  .catmgr-del{width:28px; height:28px; border-radius:50%; border:none; background:var(--paper-tint); color:var(--ink-soft); font-size:13px; flex-shrink:0;}

  .sheet .btn-ghost.full{width:100%; text-align:center; margin-top:10px; border-color:#F6D3CE; color:var(--negative);}

  .btn-ghost.full-bkp{width:100%; text-align:center; margin-top:10px;}

  ::-webkit-scrollbar{width:0px;}

  /* ---------- VISÃO PARA COMPUTADOR ----------
     Mesma marcação, mesma navegação e mesmas cores: só aproveitamos melhor
     o espaço horizontal. No celular nada disto se aplica. */

    /* Navegação continua embaixo, mas flutuando como uma barra central. */

      width:auto; max-width:none; gap:10px; border:1px solid var(--line);

<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var CATEGORIES = [
    {id:'alimentacao', nome:'Alimentação', ic:'🍽️'},
    {id:'moradia', nome:'Moradia', ic:'🏠'},
    {id:'transporte', nome:'Transporte', ic:'🚗'},
    {id:'lazer', nome:'Lazer', ic:'🎮'},
    {id:'contas', nome:'Contas', ic:'🧾'},
    {id:'saude', nome:'Saúde', ic:'💊'},
    {id:'educacao', nome:'Educação', ic:'📚'},
    {id:'compras', nome:'Compras', ic:'🛍️'},
    {id:'outros', nome:'Outros', ic:'📦'},
    {id:'renda', nome:'Renda', ic:'💰'},
    {id:'meta', nome:'Transferência p/ meta', ic:'🎯'}
  ];
  var INCOME_CATEGORIES = [
    {id:'salario', nome:'Salário', ic:'💼'}, {id:'vendas', nome:'Vendas', ic:'🛍️'},
    {id:'renda_extra', nome:'Renda extra', ic:'✨'}, {id:'outros_entrada', nome:'Outros', ic:'💰'}
  ];
  var GOAL_TYPES = [
    {id:'emergencia', nome:'Reserva de emergência', ic:'🛟'},
    {id:'viagem', nome:'Viagem', ic:'✈️'},
    {id:'celular', nome:'Celular', ic:'📱'},
    {id:'casamento', nome:'Casamento', ic:'💍'},
    {id:'divida', nome:'Quitar dívida', ic:'📉'},
    {id:'investimento', nome:'Investimento', ic:'📈'},
    {id:'carro', nome:'Comprar carro', ic:'🚗'},
    {id:'outros', nome:'Outros', ic:'🎯'}
  ];
  var PATRIMONIO_CATS = [
    {id:'rendafixa', nome:'Renda fixa', cor:'#38BDF8'},
    {id:'rendavariavel', nome:'Renda variável', cor:'#34D399'},
    {id:'conta', nome:'Dinheiro em conta', cor:'#FBBF24'},
    {id:'outros', nome:'Outros', cor:'#94A3B0'}
  ];
  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var STORAGE_KEY = 'cabe-app-data-v2';
  var STORAGE_KEY_V1 = 'cabe-app-data-v1';

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  // Qualquer alteração feita pelo usuário tira o app do "modo demonstração" —
  // assim o botão de apagar dados de exemplo some assim que os dados passam
  // a ser reais.
  function marcarComoReal(){ state.demo = false; }
  function real(v){
    v = isFinite(v) ? v : 0;
    return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  }
  function numeroAbreviado(v){
    v = Number(v)||0;
    var abs = Math.abs(v);
    if(abs < 1000) return String(Math.round(v));
    var compactado = Math.round((v/1000)*10)/10;
    return String(compactado).replace(/\.0$/,'')+'k';
  }
  function catInfo(id,tipo){
    var lista = tipo==='entrada' ? state.categoriasEntrada : state.categoriasSaida;
    return lista.find(function(c){return c.id===id;})
      || state.categoriasSaida.find(function(c){return c.id==='outros';})
      || {id:'outros', nome:'Outros', ic:'📦'};
  }
  function goalInfo(id){ return GOAL_TYPES.find(function(g){return g.id===id;}) || GOAL_TYPES[7]; }
  function patCatInfo(id){ return PATRIMONIO_CATS.find(function(c){return c.id===id;}) || PATRIMONIO_CATS[3]; }

  var today = new Date();

  var state = {
    view: 'landing',
    userName: '',
    ano: today.getFullYear(),
    mes: today.getMonth(),
    categorias: JSON.parse(JSON.stringify(CATEGORIES)), // compatibilidade com versões anteriores
    categoriasEntrada: JSON.parse(JSON.stringify(INCOME_CATEGORIES)),
    categoriasSaida: JSON.parse(JSON.stringify(CATEGORIES.filter(function(c){return c.id!=='renda' && c.id!=='meta';}))),
    transacoes: [],
    metas: [],
    ativos: [],
    recorrentes: [],
    contasPagas: [],
    cartoes: [],
    formasPagamento: [],
    faturasPagas: [],
    saldoBase: 0,
    saldosInicioMes: {},
    inicioMesV2: false,
    compromissosFuturos: 0,
    projMensal: null,
    monthlyFilterV3: true,
    avatar: '',
    filtroHistorico: 'todos', filtroTipoLancamento: 'todos', filtroVencimentos: 'todos', filtroFaturas: 'todos',
    modal: null,
    cabeValor: '',
    cabeResultado: null,
    loaded: false
  };

  function seedDemo(){
    var t = [];
    var y = today.getFullYear(), m = today.getMonth();
    function d(day, monthOffset){
      var dt = new Date(y, m + monthOffset, day);
      return dt.toISOString().slice(0,10);
    }
    // Entradas somam R$ 4.500 e saídas somam R$ 3.100 neste mês — números que
    // batem exatamente com o resumo (economizado R$ 1.400, taxa 31,1%), sem
    // nenhum valor duplicado ou inventado.
    t.push({id:uid(), tipo:'entrada', valor:4500, descricao:'Salário', categoria:'salario', data:d(5,0)});
    t.push({id:uid(), tipo:'saida', valor:87.40, descricao:'Mercado', categoria:'alimentacao', data:d(today.getDate(),0)});
    t.push({id:uid(), tipo:'saida', valor:18.90, descricao:'Uber', categoria:'transporte', data:d(Math.max(1,today.getDate()-1),0)});
    t.push({id:uid(), tipo:'saida', valor:42.00, descricao:'Restaurante', categoria:'lazer', data:d(Math.max(1,today.getDate()-1),0)});
    t.push({id:uid(), tipo:'saida', valor:1450, descricao:'Aluguel', categoria:'moradia', data:d(3,0)});
    t.push({id:uid(), tipo:'saida', valor:320, descricao:'Plano de saúde', categoria:'saude', data:d(6,0)});
    t.push({id:uid(), tipo:'saida', valor:210.50, descricao:'Conta de luz e internet', categoria:'contas', data:d(8,0)});
    t.push({id:uid(), tipo:'saida', valor:189.90, descricao:'Tênis novo', categoria:'compras', data:d(11,0)});
    t.push({id:uid(), tipo:'saida', valor:96, descricao:'Cinema com amigos', categoria:'lazer', data:d(13,0)});
    t.push({id:uid(), tipo:'saida', valor:150, descricao:'Gasolina', categoria:'transporte', data:d(14,0)});
    t.push({id:uid(), tipo:'saida', valor:535.30, descricao:'Compras do mês', categoria:'compras', data:d(16,0)});
    state.transacoes = t;
    state.metas = [
      {id:uid(), tipo:'emergencia', nome:'Reserva de emergência', valorAtual:5500, valorMeta:10000, guardarMes:500},
      {id:uid(), tipo:'viagem', nome:'Viagem pra praia', valorAtual:1200, valorMeta:4000, guardarMes:300}
    ];
    // Patrimônio é separado das metas: representa onde o dinheiro já investido
    // está guardado hoje, e não entra nas contas de entradas/saídas do mês.
    state.ativos = [
      {id:uid(), nome:'Tesouro Selic', categoria:'rendafixa', valor:15000},
      {id:uid(), nome:'Ações e fundos', categoria:'rendavariavel', valor:6250},
      {id:uid(), nome:'Conta corrente', categoria:'conta', valor:3750}
    ];
    // saldoAtual é informado manualmente pelo usuário (ex.: o que aparece no
    // extrato do banco hoje) e não é recalculado somando lançamentos de
    // outros meses — evita que o valor "ande sozinho" ao navegar entre meses.
    // Queremos que o saldo exibido seja R$ 2.900; como o saldo agora é
    // base + movimentações, guardamos a base que resulta nesse valor.
    state.saldoBase = 2900 - movimentosRealizados();
    state.compromissosFuturos = 1250;

    // Despesas recorrentes e cartões são independentes dos lançamentos do mês:
    // servem para acompanhar vencimentos, não entram em entradas/saídas até
    // virarem um lançamento de fato. As datas de início ficam no mês que
    // vem para não se misturar com o aluguel/plano de saúde já lançados acima.
    var proxMes = new Date(y, m+1, 1).toISOString().slice(0,10);
    state.recorrentes = [
      {id:uid(), tipo:'saida', ativa:true, nome:'Aluguel', categoria:'moradia', valor:1450, diaVencimento:5, duracaoTipo:'indeterminado', duracaoParcelas:null, duracaoAte:null, dataInicio:proxMes},
      {id:uid(), tipo:'saida', ativa:true, nome:'Plano de saúde', categoria:'saude', valor:320, diaVencimento:6, duracaoTipo:'indeterminado', duracaoParcelas:null, duracaoAte:null, dataInicio:proxMes},
      {id:uid(), tipo:'saida', ativa:true, nome:'Parcela do celular novo', categoria:'compras', valor:150, diaVencimento:12, duracaoTipo:'parcelas', duracaoParcelas:10, duracaoAte:null, dataInicio:proxMes}
    ];
    state.cartoes = [
      {id:uid(), nome:'Cartão principal', limite:3000, diaFechamento:25, diaVencimento:10},
      {id:uid(), nome:'Cartão internacional', limite:1500, diaFechamento:25, diaVencimento:20}
    ];
    state.formasPagamento = [
      {id:'pix', nome:'Pix', tipo:'pix'}, {id:'dinheiro', nome:'Dinheiro', tipo:'dinheiro'},
      {id:'debito', nome:'Débito', tipo:'debito'}
    ];
    state.contasPagas = [];
    state.demo = true;
  }

  // Armazenamento local: usamos localStorage para que os dados sobrevivam
  // ao fechar e reabrir a página, mesmo sem servidor ou login.
  // Retrato completo dos dados do usuário. É o que vai para o localStorage
  // e também o que vira arquivo de backup — uma única definição, para os
  // dois caminhos nunca saírem de sincronia.
  function dadosAtuais(){
    return {
      categorias: state.categorias,
      categoriasEntrada: state.categoriasEntrada,
      categoriasSaida: state.categoriasSaida,
      transacoes: state.transacoes,
      metas: state.metas,
      ativos: state.ativos,
      recorrentes: state.recorrentes,
      contasPagas: state.contasPagas,
      cartoes: state.cartoes,
      formasPagamento: state.formasPagamento,
      faturasPagas: state.faturasPagas,
      saldoBase: state.saldoBase,
      saldosInicioMes: state.saldosInicioMes,
      inicioMesV2: state.inicioMesV2,
      compromissosFuturos: state.compromissosFuturos,
      projMensal: state.projMensal,
      monthlyFilterV3: state.monthlyFilterV3,
      avatar: state.avatar,
      demo: state.demo,
      userName: state.userName
    };
  }

  function persist(){
    var payload = dadosAtuais();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }catch(e){
      // Alguns ambientes (ex.: pré-visualizações em iframe) bloqueiam localStorage.
      // Nesse caso os dados continuam funcionando normalmente nesta sessão,
      // só não são salvos entre uma visita e outra.
    }
  }

  // Busca o documento publicado novamente com uma URL única. Não remove
  // cache/localStorage e não escreve em nenhuma chave de dados; por isso os
  // lançamentos continuam disponíveis depois que a nova página abre.
  async function verificarAtualizacoes(){
    if(location.protocol==='file:'){
      return {ok:false, mensagem:'Abra o CABE pelo endereço publicado no GitHub Pages para verificar atualizações.'};
    }
    var url=new URL(window.location.href);
    url.searchParams.set('_cabe_update', String(Date.now()));
    try{
      var resposta=await fetch(url.toString(), {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
      if(!resposta.ok) return {ok:false, mensagem:'Não foi possível buscar a atualização agora. Tente novamente.'};
      window.location.replace(url.toString());
      return {ok:true, mensagem:'Versão mais recente carregando…'};
    }catch(e){
      return {ok:false, mensagem:'Sem conexão para verificar atualizações. Seus dados continuam seguros neste aparelho.'};
    }
  }

  // Atualização automática: compara a versão servida pelo GitHub Pages sem
  // usar o cache. sessionStorage guarda apenas a assinatura da página nesta
  // aba — os dados financeiros seguem exclusivamente no localStorage atual.
  var UPDATE_CHECK_INTERVAL = 5 * 60 * 1000;
  var UPDATE_SESSION_KEY = 'cabe-page-version';
  function urlDaPaginaSemCache(){
    var url=new URL(window.location.href);
    url.searchParams.set('_cabe_check', String(Date.now()));
    return url.toString();
  }
  async function versaoPublicada(){
    var resposta=await fetch(urlDaPaginaSemCache(), {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
    if(!resposta.ok) throw new Error('Não foi possível consultar a versão publicada.');
    // ETag é fornecido pelo GitHub Pages; Last-Modified é o plano B.
    return resposta.headers.get('etag') || resposta.headers.get('last-modified') || null;
  }
  function recarregarVersaoNova(){
    // Salva qualquer alteração já feita antes de trocar somente o HTML.
    persist();
    window.location.replace(urlDaPaginaSemCache());
  }
  async function verificarAtualizacaoAutomatica(inicial){
    if(location.protocol==='file:') return;
    try{
      var versao=await versaoPublicada();
      if(!versao) return;
      var anterior=sessionStorage.getItem(UPDATE_SESSION_KEY);
      sessionStorage.setItem(UPDATE_SESSION_KEY,versao);
      // Em uma nova aba, fazemos uma única recarga com URL única para garantir
      // que até um index.html antigo guardado no cache seja substituído.
      if((inicial && !anterior) || (anterior && anterior!==versao)) recarregarVersaoNova();
    }catch(e){
      // Falta de conexão nunca interrompe o uso normal do CABE.
    }
  }
  function iniciarAtualizacaoAutomatica(){
    if(location.protocol==='file:') return;
    verificarAtualizacaoAutomatica(true);
    setInterval(function(){ verificarAtualizacaoAutomatica(false); }, UPDATE_CHECK_INTERVAL);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) verificarAtualizacaoAutomatica(false); });
  }

  function loadData(){
    try{
      // Procura primeiro os dados na chave atual (v2); se não existirem,
      // tenta migrar os dados salvos pela versão anterior (v1) do CABE.
      var raw = localStorage.getItem(STORAGE_KEY);
      var migrando = false;
      if(!raw){
        raw = localStorage.getItem(STORAGE_KEY_V1);
        migrando = !!raw;
      }
      if(raw){
        aplicarDados(JSON.parse(raw));
      } else {
        seedDemo();
      }
       if(migrando || state.precisaSalvarMigracao){ persist(); } // grava os dados migrados já na nova chave (v2)
    }catch(e){
      seedDemo();
    }
    state.loaded = true;
    render();
  }

  // Carrega um conjunto de dados para dentro do app. Usada tanto na abertura
  // normal quanto ao restaurar um backup, para que as duas rotas apliquem
  // exatamente as mesmas conversões e compatibilidades.
  function aplicarDados(data){
        state.categorias = (data.categorias && data.categorias.length) ? data.categorias : JSON.parse(JSON.stringify(CATEGORIES));
        state.categoriasSaida = (data.categoriasSaida && data.categoriasSaida.length) ? data.categoriasSaida : state.categorias.filter(function(c){return c.id!=='renda' && c.id!=='meta';});
        state.categoriasEntrada = (data.categoriasEntrada && data.categoriasEntrada.length) ? data.categoriasEntrada : JSON.parse(JSON.stringify(INCOME_CATEGORIES));
        state.transacoes = data.transacoes || [];
        state.transacoes.forEach(function(t){
          if(t.tipo==='entrada' && (!t.categoria || t.categoria==='renda')) t.categoria='salario';
          // A antiga transferência para meta passa a ser uma Economia sem

        state.contasPagas = data.contasPagas || [];

        state.faturasPagas = data.faturasPagas || [];
        // Compatibilidade com cartões salvos na versão anterior.

  }

  // ---------- CALCULATIONS ----------
  // Fim do dia de hoje: tudo até aqui é "já aconteceu".
  function fimDeHoje(){ return new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59); }
  // Movimentações que JÁ saíram/entraram na conta, de qualquer mês.
  // Compras no crédito ficam de fora: elas só mexem no saldo quando a fatura
  // é paga, e já são descontadas como fatura pendente.
  function movimentosRealizados(){
    var limite = fimDeHoje();
    return state.transacoes.reduce(function(total, t){
      if(t.cartaoId || t.origemMetaId) return total;
      var d = new Date(t.data+'T00:00:00');
      if(d > limite) return total;
      if(t.tipo==='entrada') return total + Number(t.valor||0);
      return total - Number(t.valor||0); // saída e economia saem da conta
    }, 0);
  }
  // Saldo de hoje = saldo base informado + tudo que já se movimentou.
  // É a única fonte de verdade do dinheiro em conta, e acompanha
  // automaticamente cada lançamento criado, editado ou excluído.
  function saldoAtualValor(){
    return Number(state.saldoBase||0) + movimentosRealizados();
  }
  // Uma saída com origem em Meta/Reserva nunca pertence ao fluxo do saldo.
  // Ela só é usada para abater o valor da própria meta em valorMetaNoMes.
  function saidaDaReserva(t){ return !!(t && t.tipo==='saida' && t.origemMetaId && t.origemMetaId!=='saldo'); }
  function metasMensal(){
    // Para cada meta, se o usuário já registrou uma transferência para ela
    // neste mês (lançamento vinculado à meta), esse valor já saiu do saldo —
    // então não descontamos de novo o valor planejado, só o que ainda falta.
    return state.metas.reduce(function(total, m){
      var jaTransferido = state.transacoes
        .filter(function(t){
          if(t.metaId !== m.id || (t.tipo!=='economia' && !(t.tipo==='saida' && t.categoria==='meta'))) return false;
          var dt = new Date(t.data+'T00:00:00');
          // Usa o mês que está sendo visualizado, não sempre o mês de hoje.
          return dt.getFullYear()===state.ano && dt.getMonth()===state.mes;
        })
        .reduce(function(a,t){ return a + Number(t.valor); }, 0);
      var restante = Math.max(0, Number(m.guardarMes||0) - jaTransferido);
      return total + restante;
    }, 0);
  }
  // Compromissos são calculados a partir das mesmas ocorrências exibidas ao
  // usuário. Cada id só pode entrar uma vez: lançamentos futuros, recorrências
  // virtuais e faturas pendentes não se sobrepõem.
  function compromissosCalculados(){
    var ids={}, itens=[];
    function incluir(item){ if(!ids[item.id]){ ids[item.id]=true; itens.push(item); } }
    var limite=fimDeHoje();
    transacoesDoMes().forEach(function(t){
      var d=new Date(t.data+'T00:00:00');
      if(!t.virtual && t.tipo==='saida' && !t.cartaoId && !saidaDaReserva(t) && d>limite) incluir({id:'tx_'+t.id, valor:Number(t.valor||0), origem:'lancamento', data:d});
      if(t.virtual && t.tipo==='saida' && !estaContaPaga(t.recorrenteId+'_'+t.data.slice(0,7))) incluir({id:'rec_'+t.recorrenteId+'_'+t.data.slice(0,7), valor:Number(t.valor||0), origem:'recorrente', data:d});
    });
    state.cartoes.forEach(function(c){
      var f=faturaDoCartao(c,state.ano,state.mes);
      if(f.valor>0 && !f.paga) incluir({id:f.id, valor:f.valor, origem:'cartao', data:f.vencimento});
    });
    return itens;
  }
  function totalCompromissos(){
    return Number(state.compromissosFuturos||0)+compromissosCalculados().reduce(function(s,i){return s+i.valor;},0);
  }
  function disponivel(){
    // Ao consultar um mês futuro, a disponibilidade é a projeção daquele
    // mês. No mês atual, lançamentos com data futura seguem fora do saldo.
    if(mesRelativo()==='futuro'){
      return transacoesDoMes().reduce(function(total,t){
        if(saidaDaReserva(t)) return total;
        return total + (t.tipo==='entrada' ? Number(t.valor||0) : -Number(t.valor||0));
      },0);
    }
    var r=resumoMes();
    // O valor a gastar é sempre o planejamento do mês selecionado. Assim,
    // lançamentos de outro mês (inclusive futuros) nunca entram nesta conta.
    return r.entradas - saidasPlanejadasMes() - r.economia;
  }
  // Saldo que havia no primeiro dia do mês selecionado. Ele é calculado a
  // partir do saldo-base e das movimentações anteriores ao mês, sem usar
  // valores fixos ou dados de outros meses futuros.
  function saldoInicioMes(){
    var chave=state.ano+'-'+String(state.mes+1).padStart(2,'0');
    if(Object.prototype.hasOwnProperty.call(state.saldosInicioMes,chave)){
      return Number(state.saldosInicioMes[chave]||0);
    }
    // Os dois valores começam iguais. Este é congelado como referência do
    // mês; "Quanto posso gastar" continua sendo recalculado com os gastos.
    state.saldosInicioMes[chave]=disponivel();
    persist();

  }
  function aVencerNoMes(){
    var limite = fimDeHoje();
    return transacoesDoMes().reduce(function(s,t){
      if(t.cartaoId || t.virtual || t.tipo==='saida') return s; // saídas entram nos compromissos
      var d = new Date(t.data+'T00:00:00');
      if(!t.virtual && d <= limite) return s; // já realizado, já está no saldo
      return s + (t.tipo==='entrada' ? Number(t.valor||0) : -Number(t.valor||0));
    }, 0);
  }
  function faturasDoMesSelecionado(){
    return state.cartoes.reduce(function(total,c){var f=faturaDoCartao(c,state.ano,state.mes);return total+(!f.paga?f.valor:0);},0);
  }
  function diasRestantes(){
    var ultimo = new Date(state.ano, state.mes+1, 0).getDate();
    var isMesAtual = (state.ano===today.getFullYear() && state.mes===today.getMonth());
    var diaAtual = isMesAtual ? today.getDate() : 1;
    return Math.max(1, ultimo - diaAtual + 1);
  }
  function mesEhAtual(){
    return state.ano===today.getFullYear() && state.mes===today.getMonth();
  }
  function mesRelativo(){
    if(mesEhAtual()) return 'atual';

  }
  function limiteDiario(){

  }
  function transacoesDoMesEm(ano, mes){
    var manuais = state.transacoes.filter(function(t){
      var d = new Date(t.data+'T00:00:00');
      return d.getFullYear()===ano && d.getMonth()===mes;

    state.recorrentes.forEach(function(rec){
      if(rec.ativa===false) return;

      if(!ocorrencia) return;
      // A primeira ocorrência criada junto com o lançamento manual já existe
      // em transações; nunca a repetimos no mesmo mês.
      var jaExiste = manuais.some(function(t){ return t.recorrenteId===rec.id || (t.tipo===rec.tipo && t.descricao===rec.nome && t.data===ocorrencia.data); });
      if(!jaExiste) geradas.push({id:'rec_'+ocorrencia.key, tipo:rec.tipo||'saida', valor:Number(rec.valor), descricao:rec.nome, categoria:rec.categoria, data:ocorrencia.dataStr, recorrenteId:rec.id, virtual:true, formaPagamentoId:rec.formaPagamentoId||null});
    });
    return manuais.concat(geradas);
  }
  function transacoesDoMes(){ return transacoesDoMesEm(state.ano,state.mes); }
  function resumoMes(){
    var tm = transacoesDoMes();
    var entradas=0, saidas=0, economia=0;
    tm.forEach(function(t){
      var dReal=new Date(t.data+'T23:59:59');
      // Receita e economia só se tornam realizadas na própria data. Em um
      // mês futuro, continuam apenas no planejamento e não no saldo/resumo.
      if(t.tipo==='entrada' && dReal<=fimDeHoje()) entradas+=Number(t.valor);
      else if(t.tipo==='economia' && dReal<=fimDeHoje()) economia+=Number(t.valor);
      else {
        var paga = t.virtual ? estaContaPaga(t.recorrenteId+'_'+t.data.slice(0,7)) : (t.cartaoId ? (function(){var c=state.cartoes.find(function(x){return x.id===t.cartaoId;});return c&&estaFaturaPaga(t.faturaKey||chaveFaturaDaCompra(c,t.data));})() : dReal<=fimDeHoje());
        if(paga && !saidaDaReserva(t)) saidas+=Number(t.valor);
      }
    });
    var economizado = entradas - saidas - economia;
    var taxa = entradas>0 ? (economia/entradas*100) : 0;
    return {entradas:entradas, saidas:saidas, economia:economia, economizado:economizado, taxa:taxa};
  }
  // Resumo visual do mês: mostra o que está planejado, inclusive entradas e
  // economias futuras. O status dos lançamentos e o saldo real continuam
  // obedecendo estritamente à data de cada lançamento.
  function resumoPlanejadoMes(){
    var entradas=0,saidas=0,economia=0;
    transacoesDoMes().forEach(function(t){
      if(t.tipo==='entrada') entradas+=Number(t.valor||0);
      else if(t.tipo==='economia') economia+=Number(t.valor||0);
      else if(!saidaDaReserva(t)) saidas+=Number(t.valor||0);
    });
    var economizado=entradas-saidas-economia;
    return {entradas:entradas,saidas:saidas,economia:economia,economizado:economizado,taxa:entradas>0?economia/entradas*100:0};
  }
  function saidasPlanejadasMes(){ return transacoesDoMes().filter(function(t){return t.tipo==='saida'&&!saidaDaReserva(t);}).reduce(function(s,t){return s+Number(t.valor||0);},0); }
  function simularCabe(valor){
    var disp = disponivel();
    var restante = disp - valor;
    return { cabe: restante >= 0, restante: restante, faltam: Math.abs(restante) };
  }
  function disponivelNoMes(ano,mes){
    return transacoesDoMesEm(ano,mes).reduce(function(total,t){
      if(saidaDaReserva(t)) return total;
      if(t.tipo==='entrada') return total+Number(t.valor||0);
      return total-Number(t.valor||0);
    },0);
  }
  function simularCompraParcelada(valor, parcelas){
    parcelas=Math.max(1,Math.round(Number(parcelas)||1));
    var parcela=valor/parcelas, meses=[];
    for(var i=0;i<parcelas;i++){
      var d=new Date(state.ano,state.mes+i,1), base=disponivelNoMes(d.getFullYear(),d.getMonth()), restante=base-parcela;
      meses.push({ano:d.getFullYear(),mes:d.getMonth(),parcela:parcela,base:base,restante:restante,cabe:restante>=0});
    }
    return meses;
  }

  // Patrimônio é totalmente separado das metas e do fluxo de caixa mensal:
  // aqui só somamos o valor atual de cada ativo cadastrado, sem tocar em
  // entradas, saídas ou nas metas de Reserva de emergência, Viagem etc.
  function patrimonioTotal(){
    return state.ativos.reduce(function(a,at){ return a + valorAtivoNoMes(at); }, 0);
  }
  function fimMesSelecionado(){ return new Date(state.ano,state.mes+1,0,23,59,59); }
  // Valores-base são informados manualmente. As economias vinculadas são
  // somadas apenas até o fim do mês que está sendo visualizado; portanto uma
  // economia de outubro não aparece ao consultar setembro.
  function valorMetaNoMes(meta){
    var limite=new Date(Math.min(fimMesSelecionado().getTime(),fimDeHoje().getTime()));
    return Number(meta.valorBase!==undefined?meta.valorBase:meta.valorAtual||0)+state.transacoes.filter(function(t){return t.tipo==='economia'&&t.metaId===meta.id&&new Date(t.data+'T00:00:00')<=limite;}).reduce(function(s,t){return s+Number(t.valor||0);},0)-state.transacoes.filter(function(t){return t.tipo==='saida'&&t.origemMetaId===meta.id&&new Date(t.data+'T00:00:00')<=limite;}).reduce(function(s,t){return s+Number(t.valor||0);},0);
  }
  function valorAtivoNoMes(ativo){ return Number(ativo.valorBase!==undefined?ativo.valorBase:ativo.valor||0)+state.transacoes.filter(function(t){return t.tipo==='economia'&&t.alocacaoId===ativo.id&&new Date(t.data+'T00:00:00')<=fimMesSelecionado();}).reduce(function(s,t){return s+Number(t.valor||0);},0); }
  function patrimonioPorCategoria(){
    var total = patrimonioTotal();
    return PATRIMONIO_CATS.map(function(c){
      var soma = state.ativos.filter(function(a){return a.categoria===c.id;})
                              .reduce(function(a,at){return a+valorAtivoNoMes(at);},0);
      return { cat:c, valor:soma, pct: total>0 ? (soma/total*100) : 0 };
    }).filter(function(row){ return row.valor > 0; });
  }
  // A alocação de uma Economia informa somente onde o dinheiro foi guardado.
  // Ela não cria receita, despesa ou um segundo lançamento.
  function ativoDinheiroEmConta(){
    var ativo=state.ativos.find(function(a){return a.id==='conta_cabe';});
    if(!ativo){ ativo={id:'conta_cabe',nome:'Dinheiro em conta',categoria:'conta',valor:0,automatico:true}; state.ativos.push(ativo); }
    return ativo;
  }
  function aplicarAlocacaoEconomia(txn, fator){
    if(!txn || txn.tipo!=='economia' || !txn.alocacaoId || txn.alocacaoAplicada===false) return;
    var ativo=txn.alocacaoId==='conta' ? ativoDinheiroEmConta() : state.ativos.find(function(a){return a.id===txn.alocacaoId;});
    // O valor é derivado por valorAtivoNoMes; não o altere aqui. Alterá-lo
    // faria uma alocação futura aparecer no mês atual.
  }

  // ---------- RECORRÊNCIAS, FORMAS DE PAGAMENTO E FATURAS ----------
  function registroPago(lista,id){ return (lista||[]).find(function(p){return (typeof p==='string'?p:p.id)===id;}) || null; }
  function estaContaPaga(id){ return !!registroPago(state.contasPagas,id); }
  function estaFaturaPaga(id){ return !!registroPago(state.faturasPagas,id); }
  function dataPagamento(lista,id){ var p=registroPago(lista,id); return p && typeof p==='object' && p.dataPagamento ? new Date(p.dataPagamento+'T00:00:00') : null; }
  function diaClamp(ano, mes, dia){
    var ultimoDia = new Date(ano, mes+1, 0).getDate();
    return Math.min(Math.max(1,dia), ultimoDia);
  }
  function chaveOcorrencia(recId, ano, mes){
    return recId+'_'+ano+'-'+String(mes+1).padStart(2,'0');
  }
  function ocorrenciaNoMes(rec, ano, mes){
    if(rec.ativa===false) return null;
    var inicio = rec.dataInicio ? new Date(rec.dataInicio+'T00:00:00') : new Date(ano, mes, 1);
    var inicioMes = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
    var alvoMes = new Date(ano, mes, 1);
    if(alvoMes < inicioMes) return null;
    var numero = (ano-inicio.getFullYear())*12 + mes-inicio.getMonth()+1;
    if(rec.duracaoTipo==='parcelas' && numero > Number(rec.duracaoParcelas||0)) return null;
    var dia = diaClamp(ano, mes, rec.diaVencimento);
    var data = new Date(ano, mes, dia);
    if(rec.duracaoTipo==='ate' && rec.duracaoAte && data > new Date(rec.duracaoAte+'T23:59:59')) return null;
    return {rec:rec, data:data, dataStr:data.toISOString().slice(0,10), key:chaveOcorrencia(rec.id,ano,mes), numero:numero};
  }
  // Retorna as próximas `maxCount` ocorrências ainda não pagas de uma
  // despesa recorrente, respeitando a duração definida (indeterminada,
  // por X meses, ou até uma data).
  function ocorrenciasRecorrente(rec, maxCount){
    var resultados = [];
    var inicio = rec.dataInicio ? new Date(rec.dataInicio+'T00:00:00') : new Date(today.getFullYear(), today.getMonth(), 1);
    var ano = inicio.getFullYear(), mes = inicio.getMonth(), guard = 0;
    while(resultados.length < maxCount && guard < 240){
      guard++;
      var ocorrencia = ocorrenciaNoMes(rec, ano, mes);
      if(!ocorrencia && new Date(ano,mes,1) >= new Date(inicio.getFullYear(),inicio.getMonth(),1) && rec.duracaoTipo!=='indeterminado') break;
      if(ocorrencia && !estaContaPaga(ocorrencia.key)){
        resultados.push(ocorrencia);
      }
      mes++; if(mes>11){ mes=0; ano++; }
    }
    return resultados;
  }
  function chaveFatura(cartaoId, ano, mes){ return 'fatura_'+cartaoId+'_'+ano+'-'+String(mes+1).padStart(2,'0'); }
  function chaveFaturaDaCompra(cartao, data){
    var d = new Date(data+'T00:00:00'), ano=d.getFullYear(), mes=d.getMonth();
    if(d.getDate()>Number(cartao.diaFechamento||25)){ mes++; if(mes>11){mes=0;ano++;} }
    return chaveFatura(cartao.id,ano,mes);
  }
  function faturaDoCartao(cartao, ano, mes){
    var chave=chaveFatura(cartao.id,ano,mes);
    // A fatura reúne as duas formas de vincular o mesmo cartão: compras
    // pagas com ele e lançamentos feitos pela categoria de quitação da fatura.
    var itens=state.transacoes.filter(function(t){
      return (t.cartaoId===cartao.id || t.cartaoFaturaId===cartao.id) &&
        (t.faturaKey===chave || (!t.faturaKey && (t.cartaoFaturaId===cartao.id
          ? (new Date(t.data+'T00:00:00').getFullYear()===ano && new Date(t.data+'T00:00:00').getMonth()===mes)
          : chaveFaturaDaCompra(cartao,t.data)===chave)));
    });
    var valor=itens.reduce(function(s,t){return s+Number(t.valor||0);}, 0);

    return {id:chave, cartao:cartao, itens:itens, valor:valor, ano:ano, mes:mes, paga:estaFaturaPaga(chave), fechamento:new Date(ano,mes,diaClamp(ano,mes,cartao.diaFechamento)), vencimento:new Date(vencAno,vencMes,diaClamp(vencAno,vencMes,cartao.diaVencimento))};

  function faturasPendentes(){
    var lista=[];
    state.cartoes.forEach(function(c){
      for(var offset=-1;offset<=12;offset++){
        var d=new Date(state.ano,state.mes+offset,1), f=faturaDoCartao(c,d.getFullYear(),d.getMonth());
        if(f.valor>0 && !f.paga) lista.push(f);

  // Lista unificada de contas pendentes: somente despesas recorrentes e
  // faturas. Compras no crédito não são contas a pagar separadas.
  function contasPendentes(){
    var lista = [];
    state.recorrentes.filter(function(rec){return (rec.tipo||'saida')==='saida' && rec.ativa!==false;}).forEach(function(rec){
      var prox = ocorrenciasRecorrente(rec,1)[0];
      if(prox){
        lista.push({
          id: prox.key, origem:'recorrente', origemId: rec.id, nome: rec.nome,
          categoria: rec.categoria, valor: rec.valor, data: prox.data,
          parcela: rec.duracaoTipo==='parcelas' ? (prox.numero+'/'+rec.duracaoParcelas) : null
        });
      }
    });
    faturasPendentes().forEach(function(f){
      lista.push({id:f.id, origem:'cartao', origemId:f.cartao.id, nome:'Fatura '+f.cartao.nome, categoria:null, valor:f.valor, data:f.vencimento, parcela:null});
    });
    lista.sort(function(a,b){ return a.data-b.data; });
    return lista;
  }
  function contasHistorico(){
    var lista=[];
    state.recorrentes.filter(function(r){return (r.tipo||'saida')==='saida' && r.ativa!==false;}).forEach(function(r){
      var o=ocorrenciaNoMes(r,state.ano,state.mes); if(!o) return;
      lista.push({id:o.key,origem:'recorrente',origemId:r.id,nome:r.nome,categoria:r.categoria,valor:Number(r.valor||0),data:o.data,paga:estaContaPaga(o.key),dataPagamento:dataPagamento(state.contasPagas,o.key)});
    });
    state.cartoes.forEach(function(c){ for(var offset=-1;offset<=1;offset++){var d=new Date(state.ano,state.mes+offset,1),f=faturaDoCartao(c,d.getFullYear(),d.getMonth());if(f.valor>0)lista.push({id:f.id,origem:'cartao',origemId:c.id,nome:'Fatura '+c.nome,categoria:null,valor:f.valor,data:f.vencimento,paga:f.paga,dataPagamento:dataPagamento(state.faturasPagas,f.id)});}});
    return lista.sort(function(a,b){return a.data-b.data;});
  }
  function marcarContaPaga(item){
    var jaPaga = item.origem==='recorrente' ? estaContaPaga(item.id) : estaFaturaPaga(item.id);
    if(jaPaga) return;
    if(item.origem==='recorrente'){
      state.contasPagas.push({id:item.id,dataPagamento:today.toISOString().slice(0,10)});
    } else if(item.origem==='cartao'){
      state.faturasPagas.push({id:item.id,dataPagamento:today.toISOString().slice(0,10)});
    }
    // Antes do pagamento o valor já reduzia a disponibilidade como compromisso.
    // Ao pagar, ele passa a reduzir o saldo uma única vez, mantendo o total igual.
    state.saldoBase = Number(state.saldoBase||0) - Number(item.valor||0);
    marcarComoReal();
    persist();
    render();
  }

  // Marca própria do CABE: um "encaixe perfeito" — nada de carteira ou
  // cifrão, só a ideia de "cabe/confere" em forma geométrica.
  // ---------- LOGO DO CABE ----------
  // Símbolo oficial do manual de marca: dois chevrons arredondados que se
  // encaixam (a ideia de "cabe"), em azul principal (#00B4FF) e azul escuro
  // (#0B1F3B). Uma única função desenha a marca em todo o app — trocar aqui
  // troca em todo lugar. variant 'mono' é a versão branca, para usar sobre
  // fundo azul sólido (o tratamento de "ícone de app" do manual).
  // Se um dia vocês tiverem o arquivo vetorial/PNG oficial, é só preencher
  // LOGO_SRC (caminho do arquivo ou base64) que ele passa a ser usado no
  // lugar do SVG, sem precisar mexer em mais nada.
  // Arquivo oficial fornecido pelo projeto; mantenha-o ao lado deste HTML.
  var LOGO_SRC = 'Logo.png';

  function logoMark(size, variant){
    size = size || 28;
    if(LOGO_SRC){
      return '<img src="'+LOGO_SRC+'" alt="CABE" width="'+size+'" height="'+size+'" '+
             'style="width:'+size+'px; height:'+size+'px; object-fit:contain; display:block;">';
    }
    var corTopo = variant==='mono' ? '#FFFFFF' : '#00B4FF';
    var corBase = variant==='mono' ? '#FFFFFF' : '#0B1F3B';
    var opacidadeBase = variant==='mono' ? '0.78' : '1';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CABE">'+
      '<path d="M12 54 L46 86 L78 56" stroke="'+corBase+'" stroke-opacity="'+opacidadeBase+'" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M22 52 L54 22 L88 50" stroke="'+corTopo+'" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</svg>';
  }
  function fmtDateLabel(dstr){
    var d = new Date(dstr+'T00:00:00');
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.round((t0-dd)/86400000);
    if(diff===0) return 'Hoje';
    if(diff===1) return 'Ontem';
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'long'});
  }

  // Gráfico de rosca simples em SVG puro (sem bibliotecas), só com as cores
  // das categorias de patrimônio — o resto do app continua azul e branco.
  function donutSVG(rows){
    var r = 54, c = 2*Math.PI*r, offset = 0;
    var segs = '';
    rows.forEach(function(row){
      var len = (row.pct/100)*c;
      segs += '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="'+row.cat.cor+'" stroke-width="16" '+
              'stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" '+
              'transform="rotate(-90 65 65)"></circle>';
      offset += len;
    });
    return '<svg width="130" height="130" viewBox="0 0 130 130">'+
      '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--paper-tint)" stroke-width="16"></circle>'+
      segs+
      '</svg>';
  }

    wrap.appendChild(filtros);
    var totais=tm.reduce(function(a,t){a[t.tipo]+=Number(t.valor||0);return a;},{entrada:0,saida:0,economia:0});

    var groups = {};

    var parcelasInput = wrap.querySelector('#cabe-parcelas');
    parcelasInput.addEventListener('input', function(e){ state.cabeParcelas = e.target.value; });

    function paintResult(){
      var slot = wrap.querySelector('#cabe-result-slot');

      if(!state.cabeResultado) return;
      var r = state.cabeResultado;
      var card = el('<div class="result-card '+(r.cabe?'ok':'no')+'"></div>');
      if(r.cabe){
        card.innerHTML =
          '<div class="badge">✓</div><h3>CABE</h3>'+
          '<p>Depois dessa compra, você ainda terá '+real(r.restante)+' disponíveis.<br><span style="color:var(--blue-deep); font-weight:600;">Esse gasto cabe no seu orçamento.</span></p>';
      } else {
        card.innerHTML =
          '<div class="badge">✕</div><h3>NÃO CABE</h3>'+
          '<p>Essa compra ultrapassaria seu valor disponível em '+real(r.faltam)+'.<br><span style="color:var(--negative); font-weight:600;">Esse gasto pode apertar seu mês.</span></p>';
      }
      slot.appendChild(card);
      if(r.meses && r.meses.length){
        var mesesAfetados=r.meses.filter(function(m){return !m.cabe;});
        var detalhe=el('<div class="card" style="margin-top:12px; padding:15px;"><p class="card-title" style="margin-bottom:5px">Impacto das parcelas</p><p class="card-sub" style="margin-bottom:10px">'+r.parcelas+'x de '+real(r.parcela)+'. A simulação não cria nenhum lançamento.</p>'+r.meses.map(function(m){return '<div class="row" style="padding:7px 0"><span>'+MESES[m.mes]+' de '+m.ano+'</span><span style="color:'+(m.cabe?'#059669':'var(--negative)')+'">'+real(m.restante)+(m.cabe?' disponível':' · não cabe')+'</span></div>';}).join('')+(mesesAfetados.length?'<p class="card-sub" style="color:var(--negative);margin:10px 0 0">A compra compromete '+mesesAfetados.length+' mês(es) futuro(s).</p>':'')+'</div>');
        slot.appendChild(detalhe);
      }
    }
    wrap.querySelector('#cabe-btn').addEventListener('click', function(){

      state.cabeValorNum = v;
      var parcelas=Math.max(1,Math.min(120,Math.round(parseFloat(state.cabeParcelas)||1)));

      resultado.parcelas=parcelas;
      resultado.parcela=v/parcelas;
      resultado.meses=simularCompraParcelada(v,parcelas);
      resultado.cabe=resultado.meses.every(function(m){return m.cabe;});
      resultado.restante=resultado.meses[0].restante;
      resultado.faltam=Math.abs(Math.min.apply(null,resultado.meses.map(function(m){return Math.min(0,m.restante);}))); 
      state.cabeResultado = resultado;
      paintResult();
    });
    paintResult();
    return wrap;
  }

  // ---------- MODALS ----------
  // ---------- BACKUP LOCAL ----------
  // Tudo acontece no próprio navegador: o arquivo é gerado em memória e
  // baixado pelo usuário. Não há servidor, conta ou sincronização envolvida.
  function exportarBackup(){
    var backup = {
      app: 'CABE',
      tipo: 'backup',
      versao: 2,
      exportadoEm: new Date().toISOString(),
      dados: dadosAtuais()
    };
    try{
      var texto = JSON.stringify(backup, null, 2);
      var blob = new Blob([texto], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var hoje = new Date();
      var carimbo = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');
      a.href = url;
      a.download = 'cabe-backup-'+carimbo+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    }catch(e){
      return false;
    }
  }

  // Aceita tanto o arquivo novo (com envelope app/dados) quanto um JSON
  // salvo direto do armazenamento, desde que tenha cara de dado do CABE.
  function extrairDadosDoBackup(texto){
    var lido;
    try{ lido = JSON.parse(texto); }catch(e){ return null; }
    if(!lido || typeof lido !== 'object' || Array.isArray(lido)) return null;
    var dados = (lido.dados && typeof lido.dados === 'object' && !Array.isArray(lido.dados)) ? lido.dados : lido;
    if(lido.app && String(lido.app).toUpperCase() !== 'CABE') return null;
    // Um backup válido precisa trazer pelo menos uma das coleções do CABE,
    // no formato certo — senão é outro arquivo qualquer.
    var colecoes = ['transacoes','metas','ativos','recorrentes','cartoes','formasPagamento','categorias','categoriasEntrada','categoriasSaida','contasPagas','faturasPagas'];
    var achou = false;
    for(var i=0;i<colecoes.length;i++){
      var v = dados[colecoes[i]];
      if(v!==undefined){
        if(!Array.isArray(v)) return null;
        achou = true;
      }
    }
    var escalares = ['saldoBase','saldoAtual','saldoInicial','compromissosFuturos'];
    for(var j=0;j<escalares.length;j++){
      if(dados[escalares[j]]!==undefined){
        if(typeof dados[escalares[j]] !== 'number') return null;
        achou = true;
      }
    }
    return achou ? dados : null;
  }

  function restaurarBackup(dados){
    aplicarDados(dados);
    state.ano = today.getFullYear();
    state.mes = today.getMonth();
    state.cabeValor = '';
    state.cabeResultado = null;
    persist();
  }

  // primeira abertura, sem deixar resto de demonstração em nenhuma tela.
  function limparTodosOsDados(){
    state.transacoes = [];
    state.metas = [];
    state.ativos = [];
    state.recorrentes = [];
    state.contasPagas = [];
    state.cartoes = [];
    state.faturasPagas = [];
    state.formasPagamento = [{id:'pix', nome:'Pix', tipo:'pix'}, {id:'dinheiro', nome:'Dinheiro', tipo:'dinheiro'}, {id:'debito', nome:'Débito', tipo:'debito'}];
    state.categorias = JSON.parse(JSON.stringify(CATEGORIES));
    state.categoriasEntrada = JSON.parse(JSON.stringify(INCOME_CATEGORIES));
    state.categoriasSaida = JSON.parse(JSON.stringify(CATEGORIES.filter(function(c){return c.id!=='renda' && c.id!=='meta';})));
    state.saldoBase = 0;
    state.compromissosFuturos = 0;
    state.projMensal = null;
    state.cabeValor = '';
    state.cabeResultado = null;
    state.demo = false;
    state.ano = today.getFullYear();
    state.mes = today.getMonth();
    // Remove também a chave antiga da v1, senão ela poderia ser migrada de
    // volta na próxima abertura e "ressuscitar" os dados apagados.
    try{ localStorage.removeItem(STORAGE_KEY_V1); }catch(e){}
    persist();
  }

    wrap.querySelector('#f-valor').addEventListener('input', function(e){ d.valor=e.target.value; });
    wrap.querySelector('#f-desc').addEventListener('input', function(e){ d.descricao=e.target.value; });
    wrap.querySelector('#f-data').addEventListener('input', function(e){ d.data=e.target.value; });
    var recChk = wrap.querySelector('#f-recorrente');
    if(recChk){ recChk.addEventListener('change', function(e){ d.recorrente=e.target.checked; render(); }); }
    var pagSel = wrap.querySelector('#f-pagamento');
    if(pagSel){ pagSel.addEventListener('change', function(e){ d.formaPagamentoId=e.target.value; d.cartaoId=e.target.value.indexOf('cartao:')===0?e.target.value.slice(7):null; render(); }); }

    if(novoCartao){ novoCartao.addEventListener('click', function(){ state.modal={type:'cartao', editId:null, draft:{nome:'',limite:'',diaFechamento:25,diaVencimento:10}, returnToLancamento:d}; render(); }); }

    wrap.querySelector('#f-save').addEventListener('click', function(){
      var valor = parseFloat(d.valor);
      if(!valor || valor<=0 || !d.descricao || !d.data){ return; }

      // Se esta transação estiver (ou estava) vinculada a uma meta, ajustamos
      // o progresso da meta aqui — e só aqui — para não contar o valor
      // guardado duas vezes (uma na meta, outra no cálculo do disponível).
      var ehRecorrente = (d.categoria!=='meta' && !!d.recorrente);
      if(d.tipo==='saida' && d.formaPagamentoId.indexOf('cartao:')===0 && !d.cartaoId){ return; }
      var recorrenteIdAnterior = null;

      if(state.modal.editId){
        var idx = state.transacoes.findIndex(function(t){return t.id===state.modal.editId;});
        var anterior = state.transacoes[idx];
        recorrenteIdAnterior = anterior.recorrenteId || null;
        // Metas e ativos são calculados pela data do lançamento; não altere
        // seus valores-base ao editar uma economia.
        aplicarAlocacaoEconomia(anterior,-1);
        state.transacoes[idx] = { id:state.modal.editId, tipo:d.tipo, valor:valor, descricao:d.descricao, categoria:d.categoria, data:d.data, metaId: d.tipo==='economia' ? (d.metaId||null) : null, alocacaoId:d.tipo==='economia' ? (d.alocacaoId||null) : null, origemMetaId:d.tipo==='saida' ? (d.origemMetaId||null) : null, cartaoFaturaId:d.tipo==='saida' ? (d.cartaoFaturaId||null) : null, recorrente:ehRecorrente, recorrenteAte: ehRecorrente ? (d.recorrenteAte||null) : null, recorrenteId:recorrenteIdAnterior, formaPagamentoId:d.formaPagamentoId||null, cartaoId:d.tipo==='saida' && d.formaPagamentoId.indexOf('cartao:')===0 ? d.cartaoId : null };
      } else {
        state.transacoes.push({ id:uid(), tipo:d.tipo, valor:valor, descricao:d.descricao, categoria:d.categoria, data:d.data, metaId:d.tipo==='economia' ? (d.metaId||null) : null, alocacaoId:d.tipo==='economia' ? (d.alocacaoId||null) : null, origemMetaId:d.tipo==='saida' ? (d.origemMetaId||null) : null, cartaoFaturaId:d.tipo==='saida' ? (d.cartaoFaturaId||null) : null, recorrente:ehRecorrente, recorrenteAte:ehRecorrente?(d.recorrenteAte||null):null, recorrenteId:null, formaPagamentoId:d.formaPagamentoId||null, cartaoId:d.tipo==='saida'&&d.formaPagamentoId.indexOf('cartao:')===0?d.cartaoId:null });
      }
      var txnSalvo = state.modal.editId ? state.transacoes[state.transacoes.findIndex(function(t){return t.id===state.modal.editId;})] : state.transacoes[state.transacoes.length-1];
      aplicarAlocacaoEconomia(txnSalvo,1);
      if(txnSalvo.cartaoId){ var cartaoDaCompra=state.cartoes.find(function(c){return c.id===txnSalvo.cartaoId;}); if(cartaoDaCompra) txnSalvo.faturaKey=chaveFaturaDaCompra(cartaoDaCompra,txnSalvo.data); }
      else if(txnSalvo.cartaoFaturaId){ var dataFatura=new Date(txnSalvo.data+'T00:00:00'); txnSalvo.faturaKey=chaveFatura(txnSalvo.cartaoFaturaId,dataFatura.getFullYear(),dataFatura.getMonth()); }

      // Sincroniza a despesa recorrente vinculada a este lançamento: a
      // ocorrência lançada agora já está em "transacoes", então a recorrência
      // projeta a partir do mês seguinte, para não duplicar o mês atual.
      if(ehRecorrente){
        var dataOrigem = new Date(d.data+'T00:00:00');
        var proxAno = dataOrigem.getFullYear(), proxMesNum = dataOrigem.getMonth()+1;
        if(proxMesNum>11){ proxMesNum=0; proxAno++; }
        var proxDataInicio = new Date(proxAno, proxMesNum, 1).toISOString().slice(0,10);
        var registroRec = {
          id: recorrenteIdAnterior || uid(), tipo:d.tipo, nome:d.descricao, categoria:d.categoria, valor:valor,
          diaVencimento: dataOrigem.getDate(),
          duracaoTipo: d.recorrenteDuracao || (d.recorrenteAte ? 'ate' : 'indeterminado'),
          duracaoParcelas: d.recorrenteDuracao==='parcelas' ? Math.max(1,Math.round(parseFloat(d.recorrenteMeses)||1)) : null,
          duracaoAte: d.recorrenteAte || null,
          dataInicio: proxDataInicio
        };
        var idxRec = state.recorrentes.findIndex(function(r){return r.id===registroRec.id;});
        if(idxRec>-1){ state.recorrentes[idxRec]=registroRec; } else { state.recorrentes.push(registroRec); }
        txnSalvo.recorrenteId = registroRec.id;
        if(txnSalvo.cartaoId){ var cartao=state.cartoes.find(function(c){return c.id===txnSalvo.cartaoId;}); if(cartao) txnSalvo.faturaKey=chaveFaturaDaCompra(cartao,txnSalvo.data); }
      } else if(recorrenteIdAnterior){
        // Usuário desmarcou "despesa recorrente" numa edição: remove a
        // projeção futura correspondente.
        state.recorrentes = state.recorrentes.filter(function(r){return r.id!==recorrenteIdAnterior;});
        state.contasPagas = state.contasPagas.filter(function(k){ return (typeof k==='string'?k:k.id).indexOf(recorrenteIdAnterior+'_')!==0; });
      }

      marcarComoReal();
      persist();
      closeModal();
    });
    var delBtn = wrap.querySelector('#f-delete');
    if(delBtn){
      delBtn.addEventListener('click', function(){
        var alvo = state.transacoes.find(function(t){return t.id===state.modal.editId;});
        aplicarAlocacaoEconomia(alvo,-1);
        if(alvo && alvo.recorrenteId){
          state.recorrentes = state.recorrentes.filter(function(r){return r.id!==alvo.recorrenteId;});
          state.contasPagas = state.contasPagas.filter(function(k){ return (typeof k==='string'?k:k.id).indexOf(alvo.recorrenteId+'_')!==0; });
        }
        state.transacoes = state.transacoes.filter(function(t){return t.id!==state.modal.editId;});
        marcarComoReal();
        persist();
        closeModal();
      });
    }
    return wrap;
  }
