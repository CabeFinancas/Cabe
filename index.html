      if(d.duracaoTipo==='ate' && !d.duracaoAte){ return; }
      var registro = {
        id: state.modal.editId || uid(), nome:d.nome, categoria:d.categoria, valor:valor, diaVencimento:dia,
        duracaoTipo:d.duracaoTipo, duracaoParcelas: d.duracaoTipo==='parcelas' ? Math.round(parseFloat(d.duracaoParcelas)) : null,
        duracaoAte: d.duracaoTipo==='ate' ? d.duracaoAte : null, dataInicio:d.dataInicio
      };
      if(state.modal.editId){
        var idx = state.recorrentes.findIndex(function(r){return r.id===state.modal.editId;});
        state.recorrentes[idx] = registro;
      } else {
        state.recorrentes.push(registro);
      }
      marcarComoReal();
      persist();
      closeModal();
    });
    var delBtn3 = wrap.querySelector('#r-delete');
    if(delBtn3){
      delBtn3.addEventListener('click', function(){
        state.recorrentes = state.recorrentes.filter(function(r){return r.id!==state.modal.editId;});
        state.contasPagas = state.contasPagas.filter(function(k){ return (typeof k==='string'?k:k.id).indexOf(state.modal.editId+'_')!==0; });
        marcarComoReal();
        persist();
        closeModal();
      });
    }
    return wrap;
  }

  function renderCartaoForm(){
    var d = state.modal.draft;
    var wrap = el('<div></div>');
    wrap.innerHTML =
      '<div class="sheet-head"><h3>'+(state.modal.editId?'Editar cartão':'Novo cartão')+'</h3><button class="x" id="m-close">✕</button></div>'+
      '<div class="form-group"><label>Nome do cartão</label><input type="text" id="c-nome" value="'+escapeHtml(d.nome||'')+'" placeholder="Ex: Cartão principal"></div>'+
      '<div class="form-group"><label>Limite</label><input type="number" inputmode="decimal" id="c-limite" value="'+(d.limite||'')+'" placeholder="0,00"></div>'+
      '<div class="form-group"><label>Dia de fechamento da fatura</label><input type="number" id="c-fechamento" min="1" max="31" value="'+(d.diaFechamento||25)+'"></div>'+ 
      '<div class="form-group"><label>Dia do vencimento</label><input type="number" id="c-dia" min="1" max="31" value="'+(d.diaVencimento||'')+'" placeholder="Ex: 10"></div>'+
      '<button class="btn-primary" id="c-save">'+(state.modal.editId?'Salvar alterações':'Adicionar cartão')+'</button>'+
      (state.modal.editId ? '<button class="btn-ghost full" id="c-delete">Excluir cartão</button>' : '');

    wrap.querySelector('#m-close').addEventListener('click', closeModal);
    wrap.querySelector('#c-nome').addEventListener('input', function(e){ d.nome=e.target.value; });
    wrap.querySelector('#c-limite').addEventListener('input', function(e){ d.limite=e.target.value; });
    wrap.querySelector('#c-fechamento').addEventListener('input', function(e){ d.diaFechamento=e.target.value; });
    wrap.querySelector('#c-dia').addEventListener('input', function(e){ d.diaVencimento=e.target.value; });

    wrap.querySelector('#c-save').addEventListener('click', function(){
      var limite = Math.max(0, parseFloat(d.limite)||0);
      var dia = Math.round(parseFloat(d.diaVencimento));
      var fechamento = Math.round(parseFloat(d.diaFechamento));
      if(!d.nome || !dia || dia<1 || dia>31 || !fechamento || fechamento<1 || fechamento>31){ return; }
      var registro = { id: state.modal.editId || uid(), nome:d.nome, limite:limite, diaFechamento:fechamento, diaVencimento:dia };
      if(state.modal.editId){
        var idx = state.cartoes.findIndex(function(c){return c.id===state.modal.editId;});
        state.cartoes[idx] = registro;
      } else {
        state.cartoes.push(registro);
      }
      marcarComoReal();
      persist();
      if(state.modal.returnToLancamento){ state.modal={type:'lancamento',editId:null,draft:state.modal.returnToLancamento}; state.modal.draft.formaPagamentoId='cartao'; state.modal.draft.cartaoId=registro.id; render(); } else closeModal();
    });
    var delBtn4 = wrap.querySelector('#c-delete');
    if(delBtn4){
      delBtn4.addEventListener('click', function(){
        state.cartoes = state.cartoes.filter(function(c){return c.id!==state.modal.editId;});
        marcarComoReal();
        persist();
        closeModal();
      });
    }
    return wrap;
  }

  function renderPagamentosForm(){
    var wrap=el('<div></div>');
    wrap.innerHTML='<div class="sheet-head"><h3>Formas de pagamento</h3><button class="x" id="m-close">✕</button></div><div id="p-list"></div><button class="btn-ghost" id="p-add" style="width:100%; text-align:center; margin-top:8px;">+ Adicionar forma</button><button class="btn-ghost" id="p-card" style="width:100%; text-align:center; margin-top:8px;">+ Adicionar cartão</button>';
    wrap.querySelector('#m-close').addEventListener('click',closeModal);
    var list=wrap.querySelector('#p-list');
    state.formasPagamento.forEach(function(p){ list.appendChild(el('<div class="txn"><div class="icon">'+(p.tipo==='pix'?'◈':'◉')+'</div><div class="mid"><div class="d">'+escapeHtml(p.nome)+'</div><div class="c">Forma de pagamento</div></div></div>')); });
    state.cartoes.forEach(function(c){ var row=el('<div class="txn"><div class="icon">💳</div><div class="mid"><div class="d">'+escapeHtml(c.nome)+'</div><div class="c">Limite '+real(c.limite||0)+' · fecha dia '+c.diaFechamento+'</div></div></div>'); row.addEventListener('click',function(){openCartaoModal(c);}); list.appendChild(row); });
    wrap.querySelector('#p-add').addEventListener('click',function(){ var nome=window.prompt('Nome da forma de pagamento'); if(nome&&nome.trim()){state.formasPagamento.push({id:'pg_'+uid(),nome:nome.trim(),tipo:'outro'});marcarComoReal();persist();render();} });
    wrap.querySelector('#p-card').addEventListener('click',function(){openCartaoModal(null);});
    return wrap;
  }

  function renderCategoriasForm(tipo){
    var wrap = el('<div></div>');
    var lista = tipo==='entrada' ? state.categoriasEntrada : state.categoriasSaida;
    wrap.innerHTML =
      '<div class="sheet-head"><h3>Categorias de '+(tipo==='entrada'?'entrada':'saída')+'</h3><button class="x" id="m-close">✕</button></div>'+
      '<p class="card-sub" style="margin:-8px 0 16px">Edite nome e emoji. O emoji é sempre escolhido por você.</p>'+
      '<div id="cat-list"></div>'+
      '<div class="form-group" style="margin-top:6px"><label>Nova categoria</label>'+
        '<div style="display:flex; gap:8px">'+
          '<input type="text" id="cat-emoji" value="🏷️" maxlength="4" style="width:48px;text-align:center">'+
          '<input type="text" id="cat-novo" placeholder="Ex: Vôlei" style="flex:1">'+
          '<button class="btn-primary small" id="cat-add" type="button">Adicionar</button>'+
        '</div>'+
      '</div>';

    wrap.querySelector('#m-close').addEventListener('click', closeModal);

    var listEl = wrap.querySelector('#cat-list');
    lista.forEach(function(c){
      var travada = false;
      var row = el('<div class="catmgr-row"><input aria-label="Emoji" style="width:40px;flex:none;text-align:center" type="text" maxlength="4" value="'+escapeHtml(c.ic||'🏷️')+'"><input type="text" value="'+escapeHtml(c.nome)+'"'+(travada?' disabled':'')+'>'+(travada?'':'<button class="catmgr-del" type="button">✕</button>')+'</div>');
      var emojiInput = row.querySelectorAll('input')[0];
      var input = row.querySelectorAll('input')[1];
      emojiInput.addEventListener('input', function(e){ c.ic=e.target.value||'🏷️'; });
      emojiInput.addEventListener('change', function(){ persist(); render(); });
      input.addEventListener('input', function(e){ c.nome = e.target.value; });
      input.addEventListener('change', function(){
        if(!c.nome || !c.nome.trim()){ c.nome = 'Outros'; }
        persist(); render();
      });
      var delBtn = row.querySelector('.catmgr-del');
      if(delBtn){
        delBtn.addEventListener('click', function(){
          if(tipo==='entrada') state.categoriasEntrada = state.categoriasEntrada.filter(function(x){ return x.id!==c.id; }); else state.categoriasSaida = state.categoriasSaida.filter(function(x){ return x.id!==c.id; });
          persist(); render();
        });
      }
      listEl.appendChild(row);
    });

    var novoVal = '', novoEmoji='🏷️';
    wrap.querySelector('#cat-emoji').addEventListener('input', function(e){ novoEmoji=e.target.value||'🏷️'; });
    wrap.querySelector('#cat-novo').addEventListener('input', function(e){ novoVal = e.target.value; });
    wrap.querySelector('#cat-add').addEventListener('click', function(){
      var nome = novoVal.trim();
      if(!nome) return;
      lista.push({ id:(tipo==='entrada'?'in_':'out_')+uid(), nome:nome, ic:novoEmoji });
      persist(); render();
    });

    return wrap;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  loadData();
  iniciarAtualizacaoAutomatica();
})();
</script>
</body>
</html>
